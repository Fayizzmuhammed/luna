<style>

<script>
/* Join Now opens the Telegram app directly. Meta "Lead" fires on first touch.
   If the app doesn't open (e.g. Telegram not installed), after 1.5s the page
   quietly goes to the t.me invite page instead – no extra buttons shown. */
(function(){
  var a=document.querySelector('.cta'),sent=false,left=false;
  var web='https://telegram.dog/+CBZMaj4t9q9mOTY1';
  function lead(){if(sent)return;sent=true;try{fbq('track','Lead');}catch(e){}}
  addEventListener('pagehide',function(){left=true});
  document.addEventListener('visibilitychange',function(){if(document.hidden)left=true});
  a.addEventListener('pointerdown',lead,{passive:true});
  document.querySelector('.alt').addEventListener('pointerdown',lead,{passive:true});
  a.addEventListener('click',function(){
    lead();left=false;
    setTimeout(function(){if(!left&&!document.hidden)location.href=web;},1500);
  });
})();
</script>
